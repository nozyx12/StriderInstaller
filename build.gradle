plugins {
    id "java"
    id "maven-publish"
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

group = "dev.nozyx.strider"
version = "1.0.0"

repositories {
    mavenCentral()
}

dependencies {
    implementation "tools.jackson.core:jackson-databind:3.2.1"
    implementation "com.formdev:flatlaf:3.7.2"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.register("generateSourcesJar", Jar) {
    archiveClassifier.set("sources")
    from sourceSets.main.allSource
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact(tasks.named("generateSourcesJar").get())

            groupId = group
            artifactId = "striderinstaller"
            version = version
        }
    }
    repositories {
        maven {
            url = layout.buildDirectory.dir("repo").get()
        }
    }
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
}

jar {
    manifest {
        attributes(
                "Implementation-Title": "StriderInstaller",
                "Implementation-Version": version,
                "Implementation-Vendor": "nozyx12",
                "Main-Class": "dev.nozyx.strider.installer.StriderInstaller"
        )
    }
}
